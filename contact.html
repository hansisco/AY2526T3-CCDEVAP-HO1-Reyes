<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hansify - Contact</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;900&display=swap" rel="stylesheet">
</head>
<body>
  <div class="page-body">

    <div class="header">
      <div class="logo">
        <img src="images/logo.png" alt="Hansify Logo">
      </div>
      <nav class="nav">
        <a href="index.html">Home</a>
        <a href="about.html">About</a>
        <a href="favorites.html">Favorites</a>
        <a href="links.html">Links</a>
        <a href="contact.html" class="active">Contact</a>
      </nav>
      <div class="profile">
        <img src="images/profile.jpg" alt="Hans Reyes">
      </div>
    </div>

    <div class="menu">
      <div class="menu-content">
        <h3 class="menu-title">Hans' Library</h3>
        <div class="menu-links">
          <a class="menu-link" href="about.html">
            <img src="images/aboutme.png" alt="About Me">
            <span>About Me<span class="menu-link-subtitle">Album</span></span>
            </a>
          <a class="menu-link" href="favorites.html">
            <img src="images/favorites.png" alt="Favorites">
            <span>Favorites<span class="menu-link-subtitle">Album</span></span>
          </a>
          <a class="menu-link" href="links.html">
            <img src="images/links.png" alt="Links">
            <span>Links<span class="menu-link-subtitle">Album</span></span>
          </a>
          <a class="menu-link" href="contact.html">
            <img src="images/contact.png" alt="Contact">
            <span>Contact<span class="menu-link-subtitle">Album</span></span>
          </a>
        </div>
      </div>
    </div>

    <div class="main">
      <div class="main-content">
        <div class="main-title contact-page">
          <img src="images/contact.png" alt="Contact" class="main-title-img">
          <div>
            <h1>Contact</h1>
            <div class="main-profile">
              <img src="images/profile.jpg" alt="Hans Reyes">
              <span>Hans Reyes</span>
            </div>
          </div>
        </div>

        <div class="main-body">
          <h3>Send a Message</h3>
          <form>
            <label for="name">Name:</label>
            <input type="text" id="name" name="name">

            <label for="email">Email:</label>
            <input type="email" id="email" name="email">

            <label>Shared Interest:</label>
            <div class="radio-group">
              <label><input type="radio" name="interest" value="Gaming"> Gaming</label>
              <label><input type="radio" name="interest" value="Music"> Music</label>
              <label><input type="radio" name="interest" value="Movies"> Movies</label>
            </div>

            <label for="message">Message:</label>
            <textarea id="message" name="message" rows="5"></textarea>

            <button type="submit">Send Message</button>
          </form>
        </div>

      </div>
    </div>

    <div class="player">
      <div class="player-content">
        <div class="video-container">
          <video autoplay muted loop>
            <source src="video/diva.mp4" type="video/mp4">
          </video>
          <div class="overlay"></div>
          <div class="content">
            <p>Diva - Homecoming Live</p>
            <span>Beyoncé</span>
          </div>
        </div>
        <div class="audio-container">
          <audio controls>
            <source src="audio/tiktok.mp3" type="audio/mp3">
          </audio>
        </div>
      </div>
    </div>

    <div class="footer">© 2026 Hansify. All rights reserved.</div>

  </div>
</body>
</html>
